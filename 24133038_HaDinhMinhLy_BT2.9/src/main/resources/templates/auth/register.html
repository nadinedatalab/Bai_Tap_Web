<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Đăng Ký - NexusShop</title>
</head>
<body>
<section class="d-flex justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="glass-card p-5" style="width: 100%; max-width: 500px;">
        <h2 class="text-center mb-4 fw-bold">Create an Account</h2>
        
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        
        <form th:action="@{/register}" method="post">
            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" name="fullName" class="form-control" required placeholder="John Doe">
            </div>
            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input type="email" name="email" class="form-control" required placeholder="example@email.com">
            </div>
            <div class="mb-4">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" required placeholder="Min. 6 characters" minlength="6">
            </div>
            <button type="submit" class="btn btn-primary w-100">Register</button>
        </form>
        <div class="text-center mt-4 text-muted small">
            Already have an account? <a href="/login" class="text-primary fw-bold text-decoration-none">Sign In</a>
        </div>
    </div>
</section>
</body>
</html>
