<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Đăng Nhập - NexusShop</title>
</head>
<body>
<section class="d-flex justify-content-center align-items-center" style="min-height: 60vh;">
    <div class="glass-card p-5" style="width: 100%; max-width: 450px;">
        <h2 class="text-center mb-4 fw-bold">Welcome Back</h2>
        
        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        
        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input type="email" name="email" class="form-control" required placeholder="Enter your email">
            </div>
            <div class="mb-4">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" required placeholder="Enter your password">
            </div>
            <div class="d-flex justify-content-between mb-4">
                <a href="/forgot-password" class="text-primary text-decoration-none small">Forgot Password?</a>
            </div>
            <button type="submit" class="btn btn-primary w-100">Sign In</button>
        </form>
        <div class="text-center mt-4 text-muted small">
            Don't have an account? <a href="/register" class="text-primary fw-bold text-decoration-none">Sign Up</a>
        </div>
    </div>
</section>
</body>
</html>
